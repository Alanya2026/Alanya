name: APK Android

# Chaque push sur main reconstruit l'APK et remplace celle de la release « apk ».
# Les liens de téléchargement restent les mêmes d'un build à l'autre :
#   https://github.com/<dépôt>/releases/download/apk/alanya.apk (universelle)
#   https://github.com/<dépôt>/releases/download/apk/alanya-arm64.apk
#   https://github.com/<dépôt>/releases/download/apk/alanya-armv7.apk
#   https://github.com/<dépôt>/releases/download/apk/alanya-x86_64.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Un push plus récent rend le build en cours inutile.
concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Clé commune d'Alanya (alanya-release.jks) : celle des builds de toute
      # l'équipe et celle que Google connaît pour la connexion Drive.
      EXPECTED_CERT_SHA256: 4F07EBA9AE15A3707B7DA87AF69142327D44787BF5E2706C91A805F517CD3A6C
      # Ancienne clé (debug.keystore d'un poste de dev), qui a signé les APK
      # publiées ici jusqu'au 19/11/2026. Elle ne sert plus qu'à la rotation :
      # elle atteste, dans android/signing/alanya-rotation.lineage, que la clé
      # commune lui succède — sans quoi Android refuserait la mise à jour aux
      # téléphones qui ont installé une APK de cette release.
      PREVIOUS_CERT_SHA256: 2AA03CED2F5FC2537029D7F68CC235F54C17B282FB99542C2E62AE37A19DC30D
    steps:
      - uses: actions/checkout@v4

      # Le nom de version reste celui du pubspec ; seul le versionCode avance,
      # avec le numéro d'exécution — Android refuse d'installer par-dessus une
      # version dont le versionCode est plus élevé.
      - name: Version
        id: version
        run: |
          echo "name=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # La clé commune, déposée là où les postes de l'équipe l'ont :
      # android/app/alanya-release.jks et android/key.properties (jamais
      # commités). On échoue plutôt que de signer avec une autre clé.
      #
      # `storeFile` est réécrit : le secret a été copié d'un poste, où le chemin
      # pouvait être celui de ce poste.
      - name: Clés de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          PREVIOUS_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$KEYSTORE_BASE64" && -n "$KEY_PROPERTIES" ]] || { echo "::error::Secrets KEYSTORE_BASE64 / KEY_PROPERTIES manquants"; exit 1; }
          [[ -n "$PREVIOUS_KEYSTORE_BASE64" ]] || { echo "::error::Secret ANDROID_DEBUG_KEYSTORE_BASE64 manquant (rotation)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/alanya-release.jks
          printf '%s\n' "$KEY_PROPERTIES" | tr -d '\r' | grep -v '^storeFile=' > android/key.properties
          echo 'storeFile=alanya-release.jks' >> android/key.properties
          prop() { grep -m1 "^$1=" android/key.properties | cut -d= -f2-; }
          alias=$(prop keyAlias); sp=$(prop storePassword); kp=$(prop keyPassword)
          echo "::add-mask::$sp"; echo "::add-mask::$kp"
          found=$(keytool -list -v -keystore android/app/alanya-release.jks -storepass "$sp" -alias "$alias" \
            | grep -oE 'SHA256: [0-9A-F:]+' | cut -d' ' -f2 | tr -d ':')
          echo "Empreinte de la clé commune : $found"
          [[ "$found" == "$EXPECTED_CERT_SHA256" ]] || { echo "::error::Le secret KEYSTORE_BASE64 ne contient pas la clé commune attendue"; exit 1; }
          echo "$PREVIOUS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/previous.keystore"
          old=$(keytool -list -v -keystore "$RUNNER_TEMP/previous.keystore" -storepass android -alias androiddebugkey \
            | grep -oE 'SHA256: [0-9A-F:]+' | cut -d' ' -f2 | tr -d ':')
          [[ "$old" == "$PREVIOUS_CERT_SHA256" ]] || { echo "::error::Le secret ANDROID_DEBUG_KEYSTORE_BASE64 ne contient pas l'ancienne clé"; exit 1; }
          { echo "NEW_ALIAS=$alias"; echo "NEW_SP=$sp"; echo "NEW_KP=$kp"; } >> "$GITHUB_ENV"

      # Pas de `flutter test` ici tant que la suite n'est pas au vert sur main :
      # elle bloquerait toutes les publications.
      - run: flutter pub get

      # L'APK universelle, identique à un `flutter build apk --release` local,
      # puis une APK par processeur, bien plus légère : l'universelle embarque
      # les bibliothèques natives de tous. Flutter décale le versionCode des
      # secondes de 1000 × ABI : on ne peut pas repasser de l'une à
      # l'universelle sans désinstaller, d'où l'avertissement dans les notes.
      # Gradle signe avec la clé commune (android/key.properties).
      - name: Build APK
        run: |
          args="--release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.code }}"
          mkdir -p dist
          flutter build apk $args
          cp build/app/outputs/flutter-apk/app-release.apk dist/alanya.apk
          flutter build apk $args --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/alanya-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/alanya-armv7.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/alanya-x86_64.apk

      # Rotation de clé : chaque APK est re-signée avec l'ancienne clé puis la
      # clé commune et la preuve qui les relie. Android 9+ (API 28) retient la
      # clé commune et accepte la mise à jour d'une app installée avec
      # l'ancienne ; Android 7 et 8 ne connaissent pas la rotation et voient
      # l'ancienne clé, comme avant.
      - name: Rotation de clé
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in dist/*.apk; do
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/previous.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey \
              --next-signer --ks android/app/alanya-release.jks --ks-pass env:NEW_SP --ks-key-alias "$NEW_ALIAS" --key-pass env:NEW_KP \
              --lineage android/signing/alanya-rotation.lineage --rotation-min-sdk-version 28 \
              --v4-signing-enabled false \
              "$apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS && ls -lh)

      # Android 9+ doit voir la clé commune, Android 7 et 8 l'ancienne.
      - name: Vérification de la signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          signer() { "$apksigner" verify --print-certs --min-sdk-version "$2" --max-sdk-version "$2" "$1" \
            | grep -m1 'SHA-256 digest' | awk '{print toupper($NF)}'; }
          for apk in dist/*.apk; do
            recent=$(signer "$apk" 28); ancien=$(signer "$apk" 24)
            echo "$apk : Android 9+ $recent / Android 7-8 $ancien"
            [[ "$recent" == "$EXPECTED_CERT_SHA256" ]] || { echo "::error::$apk : Android 9+ ne voit pas la clé commune"; exit 1; }
            [[ "$ancien" == "$PREVIOUS_CERT_SHA256" ]] || { echo "::error::$apk : Android 7-8 ne voient pas l'ancienne clé"; exit 1; }
          done

      # Le tag « apk » est déplacé sur le commit construit ; la release qui le
      # porte garde le même nom, donc les mêmes liens.
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git tag -f apk
          git push -f origin apk
          first_line=${COMMIT_MSG%%$'\n'*}
          notes="Build n°${{ steps.version.outputs.code }} — version ${{ steps.version.outputs.name }} — commit ${GITHUB_SHA::7} du $(date -u '+%d/%m/%Y %H:%M') UTC

          ${first_line}

          • alanya.apk : fonctionne sur tous les téléphones (la plus lourde)
          • alanya-arm64.apk : presque tous les téléphones récents, bien plus légère
          • alanya-armv7.apk : anciens téléphones, si alanya-arm64.apk ne s'installe pas
          • alanya-x86_64.apk : émulateurs et rares appareils Intel

          Pour les mises à jour, reprenez toujours le même fichier : un téléphone
          passé à une APK légère refuse ensuite alanya.apk tant qu'on ne désinstalle pas."
          if gh release view apk >/dev/null 2>&1; then
            gh release edit apk --title "Alanya — dernière version" --notes "$notes" --latest
          else
            gh release create apk --title "Alanya — dernière version" --notes "$notes" --latest
          fi
          gh release upload apk dist/* --clobber

      - name: Nettoyage des clés
        if: always()
        run: rm -f "$RUNNER_TEMP/previous.keystore" android/app/alanya-release.jks android/key.properties
