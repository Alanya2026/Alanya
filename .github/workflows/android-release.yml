name: APK Android

# Chaque push sur main reconstruit l'APK et remplace celle de la release « apk ».
# Les liens de téléchargement restent les mêmes d'un build à l'autre :
#   https://github.com/<dépôt>/releases/download/apk/alanya.apk (universelle)
#   https://github.com/<dépôt>/releases/download/apk/alanya-arm64.apk
#   https://github.com/<dépôt>/releases/download/apk/alanya-armv7.apk
#   https://github.com/<dépôt>/releases/download/apk/alanya-x86_64.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Un push plus récent rend le build en cours inutile.
concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Le nom de version reste celui du pubspec ; seul le versionCode avance,
      # avec le numéro d'exécution — Android refuse d'installer par-dessus une
      # version dont le versionCode est plus élevé.
      - name: Version
        id: version
        run: |
          echo "name=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # Le build release signe avec ~/.android/debug.keystore. Celui du runner
      # serait généré à neuf : les APK déjà installées refuseraient la mise à
      # jour. On y dépose donc la clé du poste qui a produit les versions
      # actuelles — et on échoue plutôt que de signer avec une clé jetable.
      - name: Clé de signature
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$DEBUG_KEYSTORE_BASE64" ]] || { echo "::error::Secret ANDROID_DEBUG_KEYSTORE_BASE64 manquant"; exit 1; }
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      # Pas de `flutter test` ici tant que la suite n'est pas au vert sur main :
      # elle bloquerait toutes les publications.
      - run: flutter pub get

      # L'APK universelle, identique à un `flutter build apk --release` local,
      # puis une APK par processeur, bien plus légère : l'universelle embarque
      # les bibliothèques natives de tous. Flutter décale le versionCode des
      # secondes de 1000 × ABI : on ne peut pas repasser de l'une à
      # l'universelle sans désinstaller, d'où l'avertissement dans les notes.
      - name: Build APK
        run: |
          args="--release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.code }}"
          mkdir -p dist
          flutter build apk $args
          cp build/app/outputs/flutter-apk/app-release.apk dist/alanya.apk
          flutter build apk $args --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/alanya-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/alanya-armv7.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/alanya-x86_64.apk
          (cd dist && sha256sum *.apk > SHA256SUMS && ls -lh)

      # Le tag « apk » est déplacé sur le commit construit ; la release qui le
      # porte garde le même nom, donc les mêmes liens.
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git tag -f apk
          git push -f origin apk
          first_line=${COMMIT_MSG%%$'\n'*}
          notes="Build n°${{ steps.version.outputs.code }} — version ${{ steps.version.outputs.name }} — commit ${GITHUB_SHA::7} du $(date -u '+%d/%m/%Y %H:%M') UTC

          ${first_line}

          • alanya.apk : fonctionne sur tous les téléphones (la plus lourde)
          • alanya-arm64.apk : presque tous les téléphones récents, bien plus légère
          • alanya-armv7.apk : anciens téléphones, si alanya-arm64.apk ne s'installe pas
          • alanya-x86_64.apk : émulateurs et rares appareils Intel

          Pour les mises à jour, reprenez toujours le même fichier : un téléphone
          passé à une APK légère refuse ensuite alanya.apk tant qu'on ne désinstalle pas."
          if gh release view apk >/dev/null 2>&1; then
            gh release edit apk --title "Alanya — dernière version" --notes "$notes" --latest
          else
            gh release create apk --title "Alanya — dernière version" --notes "$notes" --latest
          fi
          gh release upload apk dist/* --clobber

      - name: Nettoyage de la clé
        if: always()
        run: rm -f ~/.android/debug.keystore
