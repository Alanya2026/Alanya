# Application de bureau du coffre-fort : construit l'installateur Windows,
# le paquet .deb et l'AppImage, puis prépare version.json.
#
# Se lance tout seul quand un push sur main change `version:` de
# desktop/pubspec.yaml (le seul endroit à changer pour publier une version,
# 14/11/2026) ; aussi sur une étiquette `coffre-v<version>`, ou à la main
# (onglet Actions › « Coffre de bureau » › Run workflow). Une version déjà en
# ligne n'est pas refaite : les minutes Windows comptent double sur un dépôt
# privé (gratuit dans la limite des minutes offertes par GitHub).
#
# Résultat : l'artefact « coffre-release » (les trois fichiers + version.json)
# et, sur une étiquette, le dépôt de ces fichiers sur le VPS : la page
# alanya237.com/coffre et l'avis « nouvelle version » des applications
# changent dès que version.json arrive (déposé en dernier). Le dépôt demande
# les secrets ALANYA_HOST, ALANYA_USER, ALANYA_PORT et ALANYA_SSH_KEY dans ce
# dépôt ; sans eux, il est sauté et l'artefact se dépose à la main (voir
# desktop/README.md, « Publier une version »).
# Les nouveautés affichées sur la page : desktop/release-notes.json.
# Conception : backend docs/conception/coffre-bureau.html, section 09.

name: Coffre de bureau

on:
  push:
    branches: [main]
    paths: ['desktop/pubspec.yaml']
    tags: ['coffre-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Lire la version et décider
        run: |
          PUBSPEC=$(grep '^version:' desktop/pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//' | tr -d '[:space:]')
          echo "version=$PUBSPEC" >> "$GITHUB_OUTPUT"
          EN_LIGNE=$(curl -fsS --max-time 30 https://www.alanya237.com/coffre/version.json 2>/dev/null \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
          echo "En ligne : ${EN_LIGNE:-aucune} ; pubspec.yaml : $PUBSPEC"
          # Push sur main : seulement une version plus récente que celle en
          # ligne (un push qui ne change que le +numéro, ou qui recule, ne
          # publie rien).
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$EN_LIGNE" ]; then
            if ! python3 -c 'import sys
          a=[int(x) for x in sys.argv[1].split(".")]; b=[int(x) for x in sys.argv[2].split(".")]
          sys.exit(0 if a>b else 1)' "$PUBSPEC" "$EN_LIGNE"; then
              echo "::notice::Version $PUBSPEC pas plus récente que celle en ligne ($EN_LIGNE) : rien à publier."
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/coffre-v* ]]; then
            ETIQUETTE="${GITHUB_REF#refs/tags/coffre-v}"
            if [ "$ETIQUETTE" != "$PUBSPEC" ]; then
              echo "::error::l'étiquette ($ETIQUETTE) ne correspond pas à pubspec.yaml ($PUBSPEC)"; exit 1
            fi
          fi

  linux:
    name: Linux (.deb et AppImage)
    needs: version
    if: needs.version.outputs.go == 'true'
    # Ubuntu 22.04 : le paquet s'installe aussi sur les systèmes un peu plus
    # anciens que celui qui le construit.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Outils de construction Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: Paquets
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          wget -q -O "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" linux/packaging/build_packages.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: coffre-linux
          path: |
            desktop/dist/*.deb
            desktop/dist/*.AppImage
          if-no-files-found: error
          # Étape de passage : coffre-release contient tout.
          retention-days: 1

  windows:
    name: Windows (installateur)
    needs: version
    if: needs.version.outputs.go == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bibliothèques Visual C++ à côté de l'exécutable
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" windows\installer\alanya_coffre.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: coffre-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          # Étape de passage : coffre-release contient tout.
          retention-days: 1

  release:
    name: Fichiers à publier
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/release-notes.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: version.json
        working-directory: out
        run: |
          python3 - "${{ needs.version.outputs.version }}" <<'PY'
          import hashlib, json, os, sys, datetime
          version = sys.argv[1]
          try:
              notes = json.load(open('../desktop/release-notes.json'))
          except Exception:
              notes = {}
          def fiche(nom):
              data = open(nom, 'rb').read()
              return {'file': nom, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          noms = os.listdir('.')
          trouve = lambda fin: next(n for n in noms if n.endswith(fin))
          json.dump({
              'version': version,
              'date': datetime.date.today().isoformat(),
              'notes': {'fr': str(notes.get('fr', '')), 'en': str(notes.get('en', ''))},
              'windows': fiche(trouve('.exe')),
              'deb': fiche(trouve('.deb')),
              'appimage': fiche(trouve('.AppImage')),
          }, open('version.json', 'w'), ensure_ascii=False, indent=2)
          PY
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: coffre-release
          path: out/*
          if-no-files-found: error

  publish:
    name: Dépôt sur le site
    needs: [version, release]
    # Une étiquette ou un push sur main (un lancement à la main ne fait que
    # l'artefact).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.ALANYA_HOST }}
      VPS_USER: ${{ secrets.ALANYA_USER }}
      VPS_PORT: ${{ secrets.ALANYA_PORT }}
      VPS_KEY: ${{ secrets.ALANYA_SSH_KEY }}
      DOSSIER: Alanya-backend/downloads/coffre
    steps:
      - name: Secrets présents ?
        id: secrets
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_KEY" ]; then
            echo "::warning::Secrets ALANYA_HOST, ALANYA_USER, ALANYA_SSH_KEY absents de ce dépôt : fichiers non déposés, à faire à la main (artefact coffre-release)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: coffre-release
          path: out
      - name: Déposer sur le VPS
        if: steps.secrets.outputs.ok == 'true'
        working-directory: out
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/cle
          chmod 600 ~/.ssh/cle
          P="${VPS_PORT:-22}"
          SSH="ssh -i $HOME/.ssh/cle -p $P -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          SCP="scp -i $HOME/.ssh/cle -P $P -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          $SSH "$VPS_USER@$VPS_HOST" "mkdir -p ~/$DOSSIER"
          # Les fichiers d'abord, version.json en dernier (renommé d'un coup) :
          # la page n'annonce jamais un fichier pas encore arrivé.
          $SCP *.exe *.deb *.AppImage "$VPS_USER@$VPS_HOST:$DOSSIER/"
          $SCP version.json "$VPS_USER@$VPS_HOST:$DOSSIER/version.json.nouveau"
          $SSH "$VPS_USER@$VPS_HOST" "mv ~/$DOSSIER/version.json.nouveau ~/$DOSSIER/version.json"
          rm -f ~/.ssh/cle
      - name: Vérifier la page
        if: steps.secrets.outputs.ok == 'true'
        run: |
          sleep 5
          V=$(curl -fsS https://www.alanya237.com/coffre/version.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "Version annoncée par le site : $V"
          [ "$V" = "${{ needs.version.outputs.version }}" ] || { echo "::error::le site annonce $V"; exit 1; }
