# Application de bureau du coffre-fort : construit l'installateur Windows,
# le paquet .deb et l'AppImage, puis prépare version.json.
#
# Se lance sur une étiquette `coffre-v<version>` (ex. coffre-v1.0.0), ou à la
# main (onglet Actions › « Coffre de bureau » › Run workflow). Jamais à chaque
# envoi de code : les minutes Windows comptent double sur un dépôt privé
# (gratuit dans la limite des minutes offertes par GitHub).
#
# Résultat : l'artefact « coffre-release » (les trois fichiers + version.json),
# à déposer sur le VPS (voir desktop/README.md, « Publier une version »).
# Conception : backend docs/conception/coffre-bureau.html, section 09.

name: Coffre de bureau

on:
  push:
    tags: ['coffre-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Lire et vérifier la version
        run: |
          PUBSPEC=$(grep '^version:' desktop/pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          CODE=$(grep "kAppVersion = '" desktop/lib/core/app_version.dart | sed "s/.*'\(.*\)'.*/\1/")
          if [ "$PUBSPEC" != "$CODE" ]; then
            echo "::error::pubspec.yaml ($PUBSPEC) et kAppVersion ($CODE) diffèrent"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/coffre-v* ]]; then
            ETIQUETTE="${GITHUB_REF#refs/tags/coffre-v}"
            if [ "$ETIQUETTE" != "$PUBSPEC" ]; then
              echo "::error::l'étiquette ($ETIQUETTE) ne correspond pas à pubspec.yaml ($PUBSPEC)"; exit 1
            fi
          fi
          echo "version=$PUBSPEC" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (.deb et AppImage)
    needs: version
    # Ubuntu 22.04 : le paquet s'installe aussi sur les systèmes un peu plus
    # anciens que celui qui le construit.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Outils de construction Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: Paquets
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          wget -q -O "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" linux/packaging/build_packages.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: coffre-linux
          path: |
            desktop/dist/*.deb
            desktop/dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (installateur)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bibliothèques Visual C++ à côté de l'exécutable
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" windows\installer\alanya_coffre.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: coffre-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  release:
    name: Fichiers à publier
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: version.json
        working-directory: out
        run: |
          python3 - "${{ needs.version.outputs.version }}" <<'PY'
          import hashlib, json, os, sys, datetime
          version = sys.argv[1]
          def fiche(nom):
              data = open(nom, 'rb').read()
              return {'file': nom, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          noms = os.listdir('.')
          trouve = lambda fin: next(n for n in noms if n.endswith(fin))
          json.dump({
              'version': version,
              'date': datetime.date.today().isoformat(),
              'notes': {'fr': '', 'en': ''},
              'windows': fiche(trouve('.exe')),
              'deb': fiche(trouve('.deb')),
              'appimage': fiche(trouve('.AppImage')),
          }, open('version.json', 'w'), ensure_ascii=False, indent=2)
          PY
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: coffre-release
          path: out/*
          if-no-files-found: error
